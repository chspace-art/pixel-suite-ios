kotlin.code.style=official

# GitHub 的 macOS runner 只有 3 vCPU / 7 GB，编译 Kotlin/Native 时
# 峰值在链接阶段（LLVM lld + K/N 编译器的 JVM）。这几个值是 Kotlin 官方
# 「改善 native 编译时间」文档推荐的档位，别随手调大。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=2
org.gradle.caching=true

# Kotlin/Native 增量编译（2.4.20 起 Beta），CI 上冷热差最明显的一档
kotlin.incremental.native=true

# Windows 主机上没有 iOS 工具链：让 iOS 目标被静默跳过而不是报错，
# 这样同一条 ./gradlew :shared:run 在本机（桌面目标）和 CI（iOS 目标）都成立。
kotlin.native.ignoreDisabledTargets=true

# Kotlin 2.4.20 测到 Xcode 26.4，runner 上装的是 26.6，只会打一条警告
kotlin.apple.xcodeCompatibility.nowarn=true
